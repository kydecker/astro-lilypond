name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter astro-lilypond build

      - name: Test
        run: pnpm --filter astro-lilypond test --run

      # test:integration calls render() directly against `lilypond` on PATH,
      # bypassing the integration's own auto-install — so it still needs a
      # real binary here. Everything else in CI (e.g. the docs build)
      # downloads LilyPond itself via astro-lilypond's autoInstall, on demand.
      - name: Cache LilyPond
        id: cache-lilypond
        uses: actions/cache@v6
        with:
          path: ~/.cache/astro-lilypond
          key: astro-lilypond-2.26.0-linux-x86_64

      - name: Install LilyPond
        run: node .github/scripts/install-lilypond.mjs

      - name: Integration test
        run: pnpm --filter astro-lilypond test:integration

      - name: Lint
        run: pnpm check
