name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter astro-lilypond build

      - name: Test
        run: pnpm --filter astro-lilypond test --run

      # test:integration resolves LilyPond itself via autoInstall — this just
      # caches the download so repeat runs don't re-fetch it.
      - name: Cache LilyPond
        uses: actions/cache@v6
        with:
          path: ~/.cache/astro-lilypond
          key: astro-lilypond-2.26.0-linux-x86_64

      - name: Integration test
        run: pnpm --filter astro-lilypond test:integration

      - name: Lint
        run: pnpm check
